[package]
name = "fafnir-wallet"
version = "0.1.0"
edition = "2024"
description = "Wallet mock que imita el comportamiento de la wallet Walt.id para desarrollo local"

[[bin]]
name = "fafnir-wallet"
path = "src/main.rs"

[dependencies]
## HTTP
axum = "0.8.8"
tokio = { version = "1.35.0", features = ["full"] }
#tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
# Mismas features que en ymir/Cargo.toml para que cargo unifique la
# misma versión y `reqwest::Response` sea el mismo tipo en ambos crates.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
#
## Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json_to_table = "0.12.0"
#serde_urlencoded = "0.7"
#json-canon = "0.1.3"
#
## Crypto (rust puro, sin ring)
#ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
#rsa = { version = "0.9", features = ["pem", "sha2"] }
#sha2 = "0.10"
#rand = "0.8"
#pkcs8 = "0.10"
#
## Encoding
#base64 = "0.22"
#bs58 = "0.5"
#hex = "0.4"
#urlencoding = "2.1"
#
## Util
chrono = { version = "0.4", features = ["serde"] }
#uuid = { version = "1", features = ["v4", "serde"] }
#thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
clap = { version = "4.4.9", features = [
    "env",
    "derive",
    "wrap_help",
    "unicode",
] }

ymir = {git = "https://github.com/EunomiaUPM/ymir.git", tag = "test"}
#ymir = { path = "./../ymir" }
async-trait = "0.1.89"
serde_norway = "0.9.42"
uuid = { version = "1.23.1", features = ["v4"] }
rayon = "1.12.0"
futures = { version = "0.3.32", features = ["executor"] }
