[package]
name = "fafnir-wallet"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "fafnir-wallet"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.35.0", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "1.1.1", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio", "macros", "with-json"] }
sea-orm-migration = { version = "1.1.1" }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
clap = { version = "4.4.9", features = [
    "env",
    "derive",
    "wrap_help",
    "unicode",
] }

async-trait = "0.1.89"
serde_norway = "0.9.42"
uuid = { version = "1.23.1", features = ["v4"] }
#ymir = { git = "https://github.com/EunomiaUPM/ymir.git", branch = "multi-tenancy" }
#ymir = {git = "https://github.com/EunomiaUPM/ymir.git", tag = "v0.8.4"}
ymir = { path = "./../ymir" }
